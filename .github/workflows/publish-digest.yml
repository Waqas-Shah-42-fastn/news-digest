# Publishes one day's digest to the site in a single commit.
# The fastn workflow "news-digest-slack" dispatches this with the digest as JSON, so the site gets
# one commit (and one Pages build) per digest instead of one per file.
name: Publish digest

on:
  workflow_dispatch:
    inputs:
      date:
        description: Digest date (YYYY-MM-DD, UTC)
        required: true
      digest:
        description: The digest as JSON
        required: true

permissions:
  contents: write

concurrency:
  group: publish-digest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Write docs/data/<date>.json, latest.json and index.json
        env:
          # Inputs go through env, never straight into the script.
          DATE: ${{ inputs.date }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad date '$DATE'"; exit 1; }
          printf '%s' "$DIGEST" | jq -e --arg d "$DATE" 'select(.date == $d and (.sections | type == "array"))' > digest.json \
            || { echo "::error::digest is not JSON for $DATE"; exit 1; }

          mv digest.json "docs/data/$DATE.json"
          cp "docs/data/$DATE.json" docs/data/latest.json

          # Newest first; the scaffold's sample entries go away on the first real digest.
          [ -f docs/data/index.json ] || echo '{"digests":[]}' > docs/data/index.json
          jq --arg d "$DATE" \
             --argjson n "$(jq '.totalItems' "docs/data/$DATE.json")" \
             --arg now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
             '{updatedAt: $now,
               digests: ([{date: $d, totalItems: $n}]
                 + ((if .sample then [] else (.digests // []) end) | map(select(.date != $d and (.sample | not)))))}' \
             docs/data/index.json > index.tmp
          mv index.tmp docs/data/index.json

      - name: Commit
        env:
          DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -q -m "Digest $DATE"
          # Another commit (e.g. the code backup) may have landed since checkout.
          git pull -q --rebase
          git push
